<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    /* Reset a few defaults so the page looks the same everywhere */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      /* Stack a system font list so it looks native on any device */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;

      /* Center everything on the page, both directions */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #94a3b8;
      max-width: 32ch;
    }

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.85rem;
      color: #475569;
    }
  </style>
</head>
<body>

  <h1>Coming Soon</h1>
  <p>This site is under construction. Check back shortly for more.</p>

  <footer>&copy; 2026</footer>

</body>
</html>
